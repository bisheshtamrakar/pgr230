<!DOCTYPE html>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

body{

}
.header{

}

.product-card{

    height:100%;

    flex-direction:column;
    justify-content:space-between;

.product-card img{

    width:auto;
