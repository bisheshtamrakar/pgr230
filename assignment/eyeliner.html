<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foundations - Beauty Company</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(180deg,#f9fbe7,#ffffff);
}
.header{
    background: linear-gradient(135deg,#e8f5e9,#c8e6c9);
    padding:20px;
}
.product-card:hover{
    transform:translateY(-5px);
}
.btn-custom{
    background:#2e7d32;
    color:white;
}
.btn-custom:hover{
    background:#1b5e20;
}
.product-card{
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    padding:15px;
    transition:0.3s;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.product-card img{
    height:250px;
    width:100%;
    /* object-fit:cover;   */
    border-radius:10px;
}

</style>
</head>

<body>

<header class="header text-center">
    <h2 class="text-success">Beauty Company</h2>
    <p>Glow Everyday with Confidence ✨</p>
</header>

<div class="container my-5">
<h3 class="text-center text-success mb-4">Our Best Foundations</h3>

<div class="row g-4">

<!-- Product 1 -->
<div class="col-md-4">
<div class="product-card text-center">
<img src="https://aurabeautybar.com/cdn/shop/products/Noir2.jpg?v=1585062118" class="img-fluid mb-3" alt="Pencil eyeliner">
<h5>Pencil eyeliner</h5>
<p>Lightweight matte finish for daily wear.</p>
<h6>Rs. 299</h6>
<button class="btn btn-custom">Add to Cart</button>
</div>
</div>

<!-- Product 2 -->
<div class="col-md-4">
<div class="product-card text-center">
<img src="https://static.beautytocare.com/media/catalog/product/e/s/essence-liquid-ink-eyeliner-waterproof-3ml.jpg" class="img-fluid mb-3" alt="Liquid eyeliner">
<h5>Liquid eyeliner</h5>
<p>Best for dry skin with dewy glow.</p>
<h6>Rs.499</h6>
<button class="btn btn-custom">Add to Cart</button>
</div>
</div>

<!-- Product 3 -->
<div class="col-md-4">
<div class="product-card text-center">
<img src="https://m.media-amazon.com/images/I/51jxs1HzWmL._AC_UF1000,1000_QL80_.jpg" class="img-fluid mb-3" alt="gel eyeliner">
<h5>Gel eyeliner</h5>
<p>Long-lasting coverage for events.</p>
<h6>Rs. 799</h6>
<button class="btn btn-custom">Add to Cart</button>
</div>
</div>

</div>

<div class="text-center mt-5">
<a href="index.html" class="btn btn-outline-success">⬅ Back to Home</a>
</div>

</div>

<footer class="text-center p-3 bg-light text-success">
© 2026 Beauty Company
</footer>

</body>
</html>
