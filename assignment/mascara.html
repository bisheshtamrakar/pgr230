<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foundations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(180deg, #f9fbe7, #fff);
        }

        .header {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            padding: 20px;
        }

        .card {
            border-radius: 15px;
        }

        .btn-custom {
            background: #2e7d32;
            color: white;
        }
    </style>
</head>

<body>
    <header class="header text-center">
        <h2 class="text-success">Beauty Company</h2>
    </header>

    <div class="container my-5">
        <h3 class="text-center text-success mb-4">Foundations</h3>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <img src="https://img.drz.lazcdn.com/g/kf/Se37002b89dda418d889098ad888b6934y.jpg_720x720q80.jpg"
                        class="img-fluid">
                    <h5>Glow Finish</h5>
                    <p>Daily matte smooth look.</p>
                    <h6>Rs.1299</h6>
                    <button class="btn btn-custom">Add to Cart</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <img src="https://img.drz.lazcdn.com/static/np/p/b506ba0a575441b976e15420513031e4.jpg_720x720q80.jpg" class="img-fluid">
                    <h5>Hydra Moist</h5>
                    <p>Best for dry skin glow.</p>
                    <h6>Rs.1499</h6>
                    <button class="btn btn-custom">Add to Cart</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <img src="https://static.beautytocare.com/cdn-cgi/image/width=1600,height=1600,f=auto/media/catalog/product//f/l/flormar-longer-than-ever-mascara-10ml.jpg" class="img-fluid">
                    <h5>Full Coverage</h5>
                    <p>Long lasting event wear.</p>
                    <h6>Rs.1799</h6>
                    <button class="btn btn-custom">Add to Cart</button>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
