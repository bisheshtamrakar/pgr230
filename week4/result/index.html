<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>result</title>
    <script>
        function displayResult() {
            var marks = document.getElementById('marks').value;
            var resultText = "";
            if(marks >= 90) {
                resultText = "Grade: A";
            } else if(marks >= 80) {
                resultText = "Grade: B";
            } else if(marks >= 70) {
                resultText = "Grade: C";
            } else if(marks >= 60) {
                resultText = "Grade: D";
            } else {
                resultText = "Grade: F";
            }
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = resultText;
            resultDiv.style.display = 'block';
        }
        </script>
</head>
<body>
    <h1>Result Page</h1>
       <p> Enter Your marks to see the result</p>
    <form>  
        <label for="marks">Marks:</label>
        <input type="number" id="marks" name="marks"><br><br>
    </form>
    <button type="button" onclick="displayResult()">Show Result</button>
    <div id="result" style="display: none;">   
    </div>
</body>
</html>
