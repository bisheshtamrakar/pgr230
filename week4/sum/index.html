<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>week 4</title>
</head>

<body>
    <h1>enter a two number to calculate their sum</h1>
    <form>
        <label for="num1">First Number:</label>
        <input type="number" id="num1" name="num1"><br><br>
        <label for="num2">Second Number:</label>
        <input type="number" id="num2" name="num2"><br><br> 
    </form>
    <button type="button" onclick="displaySum()">Calculate Sum</button>
    <div id="sum" style="display: none;">
    </div>
    <script>
        function displaySum() {
            var num1 = document.getElementById('num1').value;
            var num2 = document.getElementById('num2').value;
            var sum = parseFloat(num1) + parseFloat(num2);
            const sumDiv = document.getElementById('sum');
            sumDiv.innerHTML = "The sum of two numbers is: " + sum;
            sumDiv.style.display = 'block';
        }
    </script>   
</body>

</html>
